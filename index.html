<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage CMS - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-white text-emerald-950 min-h-screen flex flex-col">
    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- ЭКРАН ВХОДА -->
        <div v-if="!isAuthenticated" class="w-full max-w-md mx-auto mt-16 bg-emerald-50 p-8 rounded-xl border border-emerald-200 shadow-xl self-start">
            <h2 class="text-2xl font-bold mb-6 text-emerald-800 text-center">Вход в систему</h2>
            
            <div v-if="!isResetMode">
                <input v-model="login" type="text" placeholder="Логин (например, user_msk)" class="w-full mb-4 px-4 py-2 bg-white border border-emerald-300 rounded text-emerald-950 focus:outline-none focus:border-emerald-600 text-sm">
                <input v-model="password" type="password" placeholder="Пароль" class="w-full mb-4 px-4 py-2 bg-white border border-emerald-300 rounded text-emerald-950 focus:outline-none focus:border-emerald-600 text-sm">
                <button @click="authenticate" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition text-sm mb-3">Войти</button>
                <div class="text-center">
                    <button @click="isResetMode = true; resetForm.success = ''" class="text-xs text-emerald-700 hover:underline">Забыли пароль?</button>
                </div>
            </div>

            <div v-else class="space-y-3">
                <p class="text-xs text-emerald-800">Введите ваш логин для отправки запроса администратору:</p>
                <input v-model="resetForm.username" type="text" placeholder="Ваш логин" class="w-full px-4 py-2 bg-white border border-emerald-300 rounded text-sm focus:outline-none focus:border-emerald-600">
                <button @click="requestReset" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm font-medium">Отправить запрос</button>
                <button @click="isResetMode = false" class="w-full bg-emerald-200 hover:bg-emerald-300 text-emerald-900 py-2 rounded text-sm">Назад ко входу</button>
                <p v-if="resetForm.success" class="text-xs text-emerald-700 bg-emerald-100 p-2 rounded mt-2 text-center">{{ resetForm.success }}</p>
            </div>

            <p v-if="authError" class="mt-4 text-red-600 text-xs text-center">{{ authError }}</p>
        </div>

        <template v-else>
            <!-- УВЕДОМЛЕНИЕ ДЛЯ АДМИНА О ЗАПРОСАХ -->
            <div v-if="showAdminAlertModal && login === 'admin_main'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <div class="bg-white p-6 rounded-xl max-w-md w-full border border-emerald-200 shadow-2xl text-center">
                    <div class="text-amber-600 text-3xl mb-2">🔔</div>
                    <h3 class="text-lg font-bold text-emerald-900 mb-2">Внимание, запросы сброса!</h3>
                    <p class="text-xs text-emerald-700 mb-4">Есть активные запросы на сброс пароля от региональных пользователей.</p>
                    <div class="bg-amber-50 p-3 rounded mb-6 text-left max-h-32 overflow-y-auto border border-amber-200">
                        <div v-for="req in adminRequests" :key="req.username" class="text-xs text-amber-900 mb-1">
                            • Пользователь: <span class="font-semibold">{{ req.username }}</span> ({{ req.time }})
                        </div>
                    </div>
                    <button @click="showAdminAlertModal = false; switchTab('users')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm font-medium">Перейти к управлению</button>
                </div>
            </div>

            <aside class="w-64 bg-emerald-50 border-r border-emerald-200 flex flex-col hidden md:flex h-full">
                <div class="p-4 border-b border-emerald-200">
                    <h1 class="text-xl font-bold tracking-tight text-emerald-800">DS CMS</h1>
                    <p class="text-emerald-700 text-xs mt-1">Роль: {{ login === 'admin_main' ? 'Администратор' : 'Рег. пользователь' }}</p>
                </div>
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                    <a href="#" @click.prevent="switchTab('media')" :class="currentTab === 'media' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📁 Медиатека</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('import')" :class="currentTab === 'import' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📥 Импорт файлов</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('trash')" :class="currentTab === 'trash' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">🗑️ Корзина</a>
                    <a href="#" @click.prevent="switchTab('schedule')" :class="currentTab === 'schedule' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📅 Расписания</a>
                    <a href="#" @click.prevent="switchTab('monitoring')" :class="currentTab === 'monitoring' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">🖥️ Мониторинг сети</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('reports')" :class="currentTab === 'reports' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📊 Отчёты</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('users')" :class="currentTab === 'users' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">👥 Пользователи <span v-if="adminRequests.length > 0" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1">{{ adminRequests.length }}</span></a>
                    <a href="#" @click.prevent="switchTab('profile')" :class="currentTab === 'profile' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">👤 Профиль</a>
                </nav>
                
                <div class="p-4 border-t border-emerald-200 bg-emerald-100/40">
                    <div class="mb-4">
                        <p class="text-xs text-emerald-800 font-semibold mb-1 flex justify-between"><span>Хранилище</span><span>{{ storageStats.percent }}%</span></p>
                        <div class="w-full bg-emerald-200 rounded-full h-1.5 mb-1">
                            <div :class="storageStats.percent > 90 ? 'bg-red-500' : 'bg-emerald-500'" class="h-1.5 rounded-full" :style="{ width: storageStats.percent + '%' }"></div>
                        </div>
                        <p class="text-[10px] text-emerald-600">{{ formatSize(storageStats.used) }} из 100 ГБ</p>
                    </div>
                    <button @click="logout" class="w-full bg-red-100 hover:bg-red-200 text-red-800 border border-red-300 px-4 py-2 rounded-lg text-sm transition font-medium">Выйти</button>
                </div>
            </aside>

            <main class="flex-1 p-8 overflow-y-auto bg-white h-full">
                
                <!-- ВКЛАДКА УПРАВЛЕНИЯ ПОЛЬЗОВАТЕЛЯМИ (ТОЛЬКО ДЛЯ АДМИНА) -->
                <div v-if="currentTab === 'users' && login === 'admin_main'" class="space-y-6">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-emerald-900">Управление учетными записями</h2>
                            <button @click="fetchAdminUsers" class="text-xs bg-emerald-200 hover:bg-emerald-300 text-emerald-900 px-3 py-1.5 rounded-md font-medium">Обновить</button>
                        </div>

                        <!-- АКТИВНЫЕ ЗАПРОСЫ -->
                        <div v-if="adminRequests.length > 0" class="mb-8 bg-amber-50 border border-amber-300 rounded-lg p-4">
                            <h3 class="text-sm font-bold text-amber-900 mb-3">🔔 Запросы на сброс пароля от пользователей:</h3>
                            <div class="space-y-2">
                                <div v-for="req in adminRequests" :key="req.username" class="bg-white border border-amber-200 p-3 rounded flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-semibold text-emerald-900">Пользователь: <span class="text-emerald-700 font-bold">{{ req.username }}</span></p>
                                        <p class="text-slate-500 text-[10px]">Время запроса: {{ req.time }}</p>
                                    </div>
                                    <button @click="forceReset(req.username)" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded transition font-medium">Сбросить до user123</button>
                                </div>
                            </div>
                        </div>

                        <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ -->
                        <h3 class="text-sm font-semibold text-emerald-900 mb-3">Все пользователи системы</h3>
                        <div class="bg-white border border-emerald-200 rounded-lg overflow-hidden">
                            <table class="w-full text-sm text-left text-emerald-900">
                                <thead class="text-xs text-emerald-800 uppercase bg-emerald-100/70 border-b border-emerald-200">
                                    <tr>
                                        <th class="px-6 py-3">Логин</th>
                                        <th class="px-6 py-3">Роль</th>
                                        <th class="px-6 py-3">Филиал / Город</th>
                                        <th class="px-6 py-3">Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(info, uname) in adminUsers" :key="uname" class="border-b border-emerald-200 hover:bg-emerald-50">
                                        <td class="px-6 py-4 font-medium">{{ uname }}</td>
                                        <td class="px-6 py-4">{{ info.role === 'admin' ? 'Администратор' : 'Региональный' }}</td>
                                        <td class="px-6 py-4">{{ info.city_id }}</td>
                                        <td class="px-6 py-4">
                                            <button @click="forceReset(uname)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition">Сбросить до user123</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'profile'">
                    <section class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm max-w-xl mx-auto">
                        <h2 class="text-xl font-semibold text-emerald-900 mb-6">Настройки профиля</h2>
                        
                        <div class="mb-8 p-4 bg-white rounded-lg border border-emerald-200">
                            <p class="text-sm text-emerald-600 mb-2">Текущий пользователь:</p>
                            <p class="font-semibold text-emerald-900 text-lg">{{ login }}</p>
                            <p class="text-sm text-emerald-700 mt-1">Роль: {{ login === 'admin_main' ? 'Администратор' : 'Региональный менеджер' }}</p>
                        </div>

                        <div class="p-5 bg-white rounded-lg border border-emerald-200">
                            <h3 class="font-medium text-emerald-900 mb-4">Смена пароля</h3>
                            <input v-model="profileForm.oldPassword" type="password" placeholder="Текущий пароль" class="w-full mb-3 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            <input v-model="profileForm.newPassword" type="password" placeholder="Новый пароль" class="w-full mb-3 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            <input v-model="profileForm.confirmPassword" type="password" placeholder="Повторите новый пароль" class="w-full mb-4 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            
                            <button @click="updatePassword" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm transition font-medium">Сохранить новый пароль</button>
                            
                            <p v-if="profileForm.error" class="mt-3 text-red-600 text-sm">{{ profileForm.error }}</p>
                            <p v-if="profileForm.success" class="mt-3 text-emerald-600 text-sm font-medium">{{ profileForm.success }}</p>
                        </div>
                    </section>
                </div>

                <div v-if="currentTab === 'media'">
                    <section class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-emerald-900">Интерфейс управления контентом</h2>
                            <button @click="fetchData" class="text-xs bg-emerald-200 hover:bg-emerald-300 text-emerald-900 px-3 py-1.5 rounded-md font-medium">Обновить</button>
                        </div>
                        <div class="flex flex-col md:flex-row gap-3 mb-6 bg-white p-4 rounded-lg border border-emerald-200 shadow-sm">
                            <input v-model="searchQuery" type="text" placeholder="Поиск по имени файла..." class="flex-1 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                            <select v-if="login === 'admin_main'" v-model="filterCity" class="w-full md:w-48 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                                <option value="all">Все папки офисов</option>
                                <option value="global">Глобальная (global)</option>
                                <option value="moscow">Москва</option>
                                <option value="spb">Санкт-Петербург</option>
                                <option value="novocheboksarsk">Новочебоксарск</option>
                                <option value="yartsevo">Ярцево</option>
                                <option value="azov">Азов</option>
                                <option value="orenburg">Оренбург</option>
                                <option value="chernyakhovsk">Черняховск</option>
                            </select>
                            <select v-model="sortBy" class="w-full md:w-56 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                                <option value="date_desc">Сначала новые</option>
                                <option value="date_asc">Сначала старые</option>
                                <option value="name_asc">По имени (А - Я)</option>
                                <option value="name_desc">По имени (Я - А)</option>
                                <option value="size_desc">Размер (большие сверху)</option>
                                <option value="size_asc">Размер (маленькие сверху)</option>
                            </select>
                        </div>
                        <div v-if="filteredAndSortedFiles.length === 0" class="text-center py-8 text-emerald-700 bg-white rounded-lg border border-dashed border-emerald-200">Контент не найден.</div>
                        <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div v-for="file in filteredAndSortedFiles" :key="file.name" class="bg-white border border-emerald-200 p-4 rounded-lg flex flex-col gap-3 shadow-sm hover:shadow-md transition">
                                <div class="flex items-center gap-3">
                                    <div class="shrink-0 w-16 h-16 bg-slate-100 border border-emerald-100 rounded flex items-center justify-center overflow-hidden">
                                        <img v-if="isImage(file.name)" :src="file.url" class="object-cover w-full h-full">
                                        <video v-else-if="isVideo(file.name)" :src="file.url" class="object-cover w-full h-full" muted></video>
                                        <span v-else class="text-xs font-bold text-emerald-400">ФАЙЛ</span>
                                    </div>
                                    <div class="overflow-hidden">
                                        <p class="font-medium text-sm text-emerald-900 truncate" :title="file.name">{{ file.name }}</p>
                                        <p class="text-[11px] text-emerald-600 mt-0.5">Размер: {{ formatSize(file.size) }}</p>
                                        <p class="text-[11px] text-emerald-600">{{ formatDate(file.last_modified) }}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2 mt-auto">
                                    <a :href="file.url" target="_blank" class="flex-1 text-center bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs px-3 py-1.5 rounded transition font-medium">Смотреть</a>
                                    <button v-if="login === 'admin_main'" @click="deleteFile(file.name)" class="flex-1 bg-red-50 hover:bg-red-100 text-red-700 text-xs px-3 py-1.5 rounded border border-red-200 transition">В корзину</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <div v-if="currentTab === 'import' && login === 'admin_main'" class="space-y-6">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <h2 class="text-xl font-semibold mb-2 text-emerald-900">Импорт контента</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                            <div class="space-y-4 bg-white p-5 rounded-lg border border-emerald-200 shadow-sm">
                                <h3 class="text-sm font-semibold text-emerald-900">Параметры</h3>
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Целевой филиал:</label>
                                    <select v-model="selectedCity" class="w-full bg-white border border-emerald-300 text-sm rounded-lg p-2.5 focus:outline-none focus:border-emerald-600">
                                        <option value="global">Вся сеть (Все города)</option>
                                        <option value="moscow">Москва</option>
                                        <option value="spb">Санкт-Петербург</option>
                                        <option value="novocheboksarsk">Новочебоксарск</option>
                                        <option value="yartsevo">Ярцево</option>
                                        <option value="azov">Азов</option>
                                        <option value="orenburg">Оренбург</option>
                                        <option value="chernyakhovsk">Черняховск</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Файл:</label>
                                    <input type="file" @change="handleFileSelect" class="block w-full text-xs text-emerald-800 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-600 file:text-white cursor-pointer">
                                </div>
                                <div v-if="uploading" class="w-full bg-emerald-100 rounded-full h-2">
                                  <div class="bg-emerald-600 h-2 rounded-full transition-all duration-300" :style="{ width: uploadProgress + '%' }"></div>
                                </div>
                                <button @click="uploadFile" :disabled="!selectedFile || uploading" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 text-white font-medium px-4 py-2.5 rounded-lg transition text-sm">
                                    {{ uploading ? `Загрузка... ${uploadProgress}%` : 'Начать импорт' }}
                                </button>
                                <p v-if="uploadError" class="text-red-600 text-xs mt-2">{{ uploadError }}</p>
                            </div>
                            <div class="bg-white p-5 rounded-lg border border-emerald-200 shadow-sm">
                                <h3 class="text-sm font-semibold text-emerald-900 mb-3">Журнал обработки</h3>
                                <div v-if="importLogs.length === 0" class="text-xs text-emerald-600 py-12 text-center border border-dashed border-emerald-200 rounded-lg">Отчет пуст.</div>
                                <div v-else class="space-y-2 max-h-64 overflow-y-auto">
                                    <div v-for="(log, idx) in importLogs" :key="idx" class="p-3 rounded text-xs border" :class="log.success ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'">
                                        <p class="font-semibold">{{ log.filename }} — <span>{{ log.success ? 'Успешно' : 'Ошибка' }}</span></p>
                                        <p class="mt-0.5">{{ log.text }}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'trash' && login === 'admin_main'">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-semibold text-emerald-900">Корзина</h2>
                            <button v-if="trashFiles.length > 0" @click="emptyTrash" class="text-xs bg-red-100 text-red-800 px-3 py-1.5 rounded-md border border-red-200">Очистить всё</button>
                        </div>
                        <div v-if="trashFiles.length === 0" class="text-center py-12 text-emerald-600 border border-dashed border-emerald-200 rounded-lg bg-white">Корзина пуста.</div>
                        <div v-else class="space-y-3">
                            <div v-for="file in trashFiles" :key="file.name" class="bg-white border border-emerald-200 p-4 rounded-lg flex justify-between items-center shadow-sm">
                                <p class="font-medium text-emerald-900 text-sm">{{ file.name }}</p>
                                <button @click="restoreFile(file.name)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded-md shadow-sm">Восстановить</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'schedule'" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-emerald-900">График трансляций (Smart Planner)</h2>
                        <button v-if="login === 'admin_main'" @click="showAddModal = true" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm shadow-sm">+ Запланировать</button>
                    </div>

                    <div v-if="showAddModal" class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-md">
                        <h3 class="text-lg font-medium mb-4 text-emerald-800">Новый запуск (с проверкой конфликтов)</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs text-emerald-700 mb-1 font-medium">Медиафайл</label>
                                <select v-model="newSchedule.file" class="w-full bg-white border border-emerald-300 rounded p-2.5 text-sm">
                                    <option v-for="f in files" :key="f.name" :value="f.name">{{ f.name }}</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-emerald-700 mb-1 font-medium">Филиал (Город)</label>
                                <select v-model="newSchedule.city" @change="onCityChange" class="w-full bg-white border border-emerald-300 rounded p-2.5 text-sm">
                                    <option value="global">Вся сеть</option>
                                    <option value="moscow">Москва</option>
                                    <option value="spb">Санкт-Петербург</option>
                                    <option value="novocheboksarsk">Новочебоксарск</option>
                                    <option value="yartsevo">Ярцево</option>
                                    <option value="azov">Азов</option>
                                    <option value="orenburg">Оренбург</option>
                                    <option value="chernyakhovsk">Черняховск</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2 bg-white p-4 rounded-lg border border-emerald-200">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-semibold text-emerald-800">Целевые экраны:</label>
                                    <button @click="selectAllScreens" class="text-xs text-emerald-600 hover:underline">Выбрать все</button>
                                </div>
                                <div class="flex flex-wrap gap-3 mt-2">
                                    <label v-for="scr in availableScreens" :key="scr" class="flex items-center gap-2 text-xs bg-emerald-50 px-3 py-1.5 rounded border border-emerald-200">
                                        <input type="checkbox" :value="scr" v-model="newSchedule.screens" class="rounded"> {{ scr }}
                                    </label>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-emerald-700 mb-1 font-medium">Начало</label>
                                <input v-model="newSchedule.time_start" type="datetime-local" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-emerald-700 mb-1 font-medium">Окончание</label>
                                <input v-model="newSchedule.time_end" type="datetime-local" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button @click="showAddModal = false" class="bg-emerald-200 text-emerald-900 px-4 py-2 rounded text-sm">Отмена</button>
                            <button @click="addSchedule" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm">Сохранить</button>
                        </div>
                    </div>
                    
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm overflow-x-auto">
                        <table v-if="schedules.length > 0" class="w-full text-sm text-left text-emerald-900">
                            <thead class="text-xs text-emerald-800 uppercase bg-emerald-100/70 border-b border-emerald-200">
                                <tr>
                                    <th class="px-6 py-3">Медиафайл</th>
                                    <th class="px-6 py-3">Экраны</th>
                                    <th class="px-6 py-3">Время</th>
                                    <th class="px-6 py-3">Статус</th>
                                    <th v-if="login === 'admin_main'" class="px-6 py-3">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="item in schedules" :key="item.id" class="border-b border-emerald-200 hover:bg-emerald-100/40">
                                    <td class="px-6 py-4 font-medium">{{ item.file }}</td>
                                    <td class="px-6 py-4">{{ !item.screens || item.screens.length === 0 ? 'Все экраны' : item.screens.join(', ') }}</td>
                                    <td class="px-6 py-4 text-[11px] leading-tight">
                                        С: {{ item.time_start.replace('T', ' ') }}<br>По: {{ item.time_end.replace('T', ' ') }}
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-1 rounded text-xs font-medium" :class="{ 'text-emerald-800 bg-emerald-300': item.status === 'Активен', 'text-amber-800 bg-amber-200': item.status === 'Ожидание', 'text-slate-600 bg-slate-200': item.status === 'Завершен' }">
                                            {{ item.status }}
                                        </span>
                                    </td>
                                    <td v-if="login === 'admin_main'" class="px-6 py-4">
                                        <button @click="deleteSchedule(item.id)" class="text-red-700 text-xs">Удалить</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div v-if="currentTab === 'monitoring'">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-emerald-900">Мониторинг сети экранов</h2>
                            <button @click="fetchMonitoring" class="text-xs bg-emerald-200 text-emerald-900 px-3 py-1.5 rounded-md font-medium">Обновить статус</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div v-for="sc in monitoringData" :key="sc.screen" class="bg-white border border-emerald-200 p-4 rounded-lg flex items-center justify-between shadow-sm">
                                <div>
                                    <p class="font-medium text-sm text-emerald-900">{{ sc.screen }}</p>
                                    <p class="text-[11px] text-emerald-600 mt-1 uppercase tracking-wide">{{ sc.city }}</p>
                                </div>
                                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border" :class="sc.status === 'В сети' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'">
                                    <span class="w-2 h-2 rounded-full" :class="sc.status === 'В сети' ? 'bg-emerald-500' : 'bg-red-500'"></span>
                                    {{ sc.status }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'reports' && login === 'admin_main'">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm flex flex-col justify-center items-center">
                                <h3 class="text-emerald-700 text-sm font-semibold uppercase tracking-wide">Запланировано показов</h3>
                                <p class="text-5xl font-bold text-emerald-900 mt-2">{{ analyticsData.total_shows }}</p>
                            </div>
                            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm flex flex-col justify-center items-center">
                                <h3 class="text-emerald-700 text-sm font-semibold uppercase tracking-wide">Суммарное время (часы)</h3>
                                <p class="text-5xl font-bold text-emerald-900 mt-2">{{ analyticsData.total_hours }}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-white border border-emerald-200 rounded-xl p-6 shadow-sm">
                                <h3 class="text-emerald-900 font-semibold mb-4 text-center">Статусы трансляций</h3>
                                <div class="relative h-64">
                                    <canvas id="chartStatus"></canvas>
                                </div>
                            </div>
                            <div class="bg-white border border-emerald-200 rounded-xl p-6 shadow-sm">
                                <h3 class="text-emerald-900 font-semibold mb-4 text-center">Трансляции по филиалам</h3>
                                <div class="relative h-64">
                                    <canvas id="chartCity"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </template>
    </div>

    <script>
        const { createApp, ref, computed } = Vue
        
        createApp({
            setup() {
                const login = ref(''); const password = ref(''); const isAuthenticated = ref(false); 
                const authError = ref(''); const authHeader = ref(''); const currentTab = ref('media');
                
                const isResetMode = ref(false);
                const resetForm = ref({ username: '', success: '' });
                const showAdminAlertModal = ref(false);

                const adminUsers = ref({});
                const adminRequests = ref([]);

                const files = ref([]); const trashFiles = ref([]); const selectedFile = ref(null); 
                const selectedCity = ref('global'); const uploading = ref(false);
                const uploadError = ref(''); const importLogs = ref([]); const uploadProgress = ref(0);
                
                const searchQuery = ref(''); const filterCity = ref('all'); const sortBy = ref('date_desc');
                const showAddModal = ref(false); const allScreensMap = ref({}); const availableScreens = ref([]);
                const storageStats = ref({used: 0, max: 0, percent: 0}); const monitoringData = ref([]);
                
                const analyticsData = ref({ total_shows: 0, total_hours: 0, status_counts: {}, city_counts: {} });
                let chartStatusInstance = null; let chartCityInstance = null;

                const newSchedule = ref({ file: '', city: 'global', screens: [], time_start: '', time_end: '' });
                const schedules = ref([]);

                const profileForm = ref({ oldPassword: '', newPassword: '', confirmPassword: '', error: '', success: '' });

                const isImage = (name) => /\.(jpeg|jpg|png|webp|gif|svg|heic)$/i.test(name);
                const isVideo = (name) => /\.(mp4|mov|mkv|webm|avi)$/i.test(name);

                const filteredAndSortedFiles = computed(() => {
                    let result = files.value;
                    if (searchQuery.value) result = result.filter(f => f.name.toLowerCase().includes(searchQuery.value.toLowerCase()));
                    if (login.value === 'admin_main' && filterCity.value !== 'all') {
                        result = result.filter(f => f.name.startsWith(filterCity.value + '/'));
                    }
                    result = result.slice().sort((a, b) => {
                        if (sortBy.value === 'name_asc') return a.name.localeCompare(b.name);
                        if (sortBy.value === 'name_desc') return b.name.localeCompare(a.name);
                        if (sortBy.value === 'size_desc') return b.size - a.size;
                        if (sortBy.value === 'size_asc') return a.size - b.size;
                        const dateA = new Date(a.last_modified).getTime() || 0;
                        const dateB = new Date(b.last_modified).getTime() || 0;
                        if (sortBy.value === 'date_desc') return dateB - dateA;
                        if (sortBy.value === 'date_asc') return dateA - dateB;
                        return 0;
                    });
                    return result;
                });

                const authenticate = async () => {
                    authHeader.value = 'Basic ' + btoa(login.value + ':' + password.value)
                    try {
                        const response = await fetch('http://localhost:8000/files/', { headers: { 'Authorization': authHeader.value } })
                        if (response.ok) { 
                            isAuthenticated.value = true; 
                            
                            if (login.value === 'admin_main') {
                                // Проверяем запросы для админа
                                const reqRes = await fetch('http://localhost:8000/admin/users/', { headers: { 'Authorization': authHeader.value } });
                                const reqData = await reqRes.json();
                                adminRequests.value = reqData.requests || [];
                                if (adminRequests.value.length > 0) {
                                    showAdminAlertModal.value = true;
                                }
                            }

                            fetchData(); fetchScreens(); fetchTrash(); fetchStats(); fetchMonitoring();
                        } else { authError.value = 'Неверный логин/пароль' }
                    } catch (e) { authError.value = 'Сервер недоступен' }
                }

                const requestReset = async () => {
                    if (!resetForm.value.username) return;
                    try {
                        const res = await fetch('http://localhost:8000/request-reset/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: resetForm.value.username })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            resetForm.value.success = 'Запрос успешно отправлен администратору!';
                        } else {
                            resetForm.value.success = data.detail || 'Ошибка';
                        }
                    } catch (e) { resetForm.value.success = 'Ошибка сети'; }
                }

                const fetchAdminUsers = async () => {
                    try {
                        const res = await fetch('http://localhost:8000/admin/users/', { headers: { 'Authorization': authHeader.value } });
                        const data = await res.json();
                        if (res.ok) {
                            adminUsers.value = data.users || {};
                            adminRequests.value = data.requests || [];
                        }
                    } catch (e) {}
                }

                const forceReset = async (uname) => {
                    if (!confirm(`Сбросить пароль для пользователя ${uname} до 'user123'?`)) return;
                    try {
                        const res = await fetch('http://localhost:8000/admin/reset-password/', {
                            method: 'POST',
                            headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: uname })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            alert(data.message);
                            fetchAdminUsers();
                        } else {
                            alert(data.detail || 'Ошибка');
                        }
                    } catch (e) { alert('Ошибка сети'); }
                }

                const logout = () => { isAuthenticated.value = false; login.value = ''; password.value = ''; files.value = []; trashFiles.value = []; schedules.value = []; currentTab.value = 'media'; showAdminAlertModal.value = false; }
                
                const updatePassword = async () => {
                    profileForm.value.error = ''; profileForm.value.success = '';
                    if (!profileForm.value.oldPassword || !profileForm.value.newPassword) {
                        profileForm.value.error = 'Заполните все поля'; return;
                    }
                    if (profileForm.value.newPassword !== profileForm.value.confirmPassword) {
                        profileForm.value.error = 'Новые пароли не совпадают'; return;
                    }
                    try {
                        const res = await fetch('http://localhost:8000/change-password/', {
                            method: 'POST',
                            headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ old_password: profileForm.value.oldPassword, new_password: profileForm.value.newPassword })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            profileForm.value.success = 'Пароль успешно изменен! Пожалуйста, войдите с новым паролем.';
                            profileForm.value.oldPassword = ''; profileForm.value.newPassword = ''; profileForm.value.confirmPassword = '';
                            setTimeout(() => logout(), 2000);
                        } else {
                            profileForm.value.error = data.detail || 'Ошибка смены пароля';
                        }
                    } catch (e) { profileForm.value.error = 'Ошибка сети'; }
                }

                const fetchScreens = async () => {
                    const res = await fetch('http://localhost:8000/screens/', { headers: { 'Authorization': authHeader.value } })
                    const data = await res.json(); allScreensMap.value = data.screens || {};
                }
                const fetchStats = async () => {
                    const res = await fetch('http://localhost:8000/storage-stats/', { headers: { 'Authorization': authHeader.value } })
                    storageStats.value = await res.json();
                }
                const fetchMonitoring = async () => {
                    const res = await fetch('http://localhost:8000/monitoring/', { headers: { 'Authorization': authHeader.value } })
                    const data = await res.json(); monitoringData.value = data.monitoring || [];
                }
                const fetchAnalytics = async () => {
                    const res = await fetch('http://localhost:8000/analytics/', { headers: { 'Authorization': authHeader.value } })
                    analyticsData.value = await res.json();
                    
                    setTimeout(() => {
                        if (chartStatusInstance) chartStatusInstance.destroy();
                        if (chartCityInstance) chartCityInstance.destroy();
                        
                        const ctxStatus = document.getElementById('chartStatus');
                        if (ctxStatus) {
                            chartStatusInstance = new Chart(ctxStatus, {
                                type: 'doughnut',
                                data: {
                                    labels: Object.keys(analyticsData.value.status_counts),
                                    datasets: [{ data: Object.values(analyticsData.value.status_counts), backgroundColor: ['#fbbf24', '#34d399', '#cbd5e1'] }]
                                },
                                options: { responsive: true, maintainAspectRatio: false }
                            });
                        }
                        
                        const ctxCity = document.getElementById('chartCity');
                        if (ctxCity) {
                            chartCityInstance = new Chart(ctxCity, {
                                type: 'bar',
                                data: {
                                    labels: Object.keys(analyticsData.value.city_counts),
                                    datasets: [{ label: 'Трансляции', data: Object.values(analyticsData.value.city_counts), backgroundColor: '#059669' }]
                                },
                                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                            });
                        }
                    }, 100);
                }
                
                const switchTab = (tab) => {
                    currentTab.value = tab;
                    if (tab === 'reports') fetchAnalytics();
                    if (tab === 'users') fetchAdminUsers();
                }

                const fetchData = async () => {
                    const resFiles = await fetch('http://localhost:8000/files/', { headers: { 'Authorization': authHeader.value } })
                    const dataFiles = await resFiles.json(); files.value = dataFiles.files || []
                    const resSched = await fetch('http://localhost:8000/schedules/', { headers: { 'Authorization': authHeader.value } })
                    const dataSched = await resSched.json(); schedules.value = dataSched.schedules || []
                    fetchStats();
                }
                const fetchTrash = async () => {
                    const res = await fetch('http://localhost:8000/trash/', { headers: { 'Authorization': authHeader.value } })
                    const data = await res.json(); trashFiles.value = data.trash || []
                }

                const onCityChange = () => {
                    availableScreens.value = newSchedule.value.city === 'global' ? [] : (allScreensMap.value[newSchedule.value.city] || []);
                    newSchedule.value.screens = [];
                }
                const selectAllScreens = () => { newSchedule.value.screens = [...availableScreens.value]; }
                const handleFileSelect = (e) => selectedFile.value = e.target.files[0]
                
                const uploadFile = () => {
                    if (!selectedFile.value) return;
                    uploading.value = true; uploadError.value = ''; uploadProgress.value = 0;
                    const formData = new FormData();
                    formData.append('file', selectedFile.value); formData.append('target_city', selectedCity.value);
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'http://localhost:8000/upload/', true);
                    xhr.setRequestHeader('Authorization', authHeader.value);
                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) uploadProgress.value = Math.round((event.loaded / event.total) * 100);
                    };
                    xhr.onload = () => {
                        uploading.value = false;
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (xhr.status === 200) {
                                importLogs.value.unshift({ filename: selectedFile.value.name, success: true, text: data.message });
                                selectedFile.value = null; fetchData();
                            } else {
                                uploadError.value = data.detail || 'Ошибка импорта';
                                importLogs.value.unshift({ filename: selectedFile.value.name, success: false, text: data.detail });
                            }
                        } catch (e) { uploadError.value = 'Ошибка сервера'; }
                    };
                    xhr.onerror = () => { uploading.value = false; uploadError.value = 'Сервер недоступен'; };
                    xhr.send(formData);
                }

                const deleteFile = async (fileName) => {
                    if (!confirm(`Удалить в корзину?`)) return
                    await fetch(`http://localhost:8000/files/${encodeURIComponent(fileName)}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } })
                    fetchData(); fetchTrash();
                }
                const restoreFile = async (fileName) => {
                    await fetch(`http://localhost:8000/trash/restore/${encodeURIComponent(fileName)}`, { method: 'POST', headers: { 'Authorization': authHeader.value } })
                    fetchData(); fetchTrash();
                }
                const emptyTrash = async () => {
                    if (!confirm('Очистить корзину навсегда?')) return
                    await fetch('http://localhost:8000/trash/empty/', { method: 'DELETE', headers: { 'Authorization': authHeader.value } })
                    fetchTrash();
                }

                const addSchedule = async () => {
                    if (!newSchedule.value.file || !newSchedule.value.time_start || !newSchedule.value.time_end) return alert('Заполните все поля');
                    const response = await fetch('http://localhost:8000/schedules/', { 
                        method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(newSchedule.value) 
                    });
                    const resData = await response.json();
                    if (!response.ok) {
                        alert(resData.detail);
                    } else {
                        newSchedule.value = { file: '', city: 'global', screens: [], time_start: '', time_end: '' };
                        showAddModal.value = false; fetchData();
                    }
                }

                const deleteSchedule = async (id) => {
                    await fetch(`http://localhost:8000/schedules/${id}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                    fetchData();
                }

                const formatSize = (bytes) => {
                    if (bytes === 0) return '0 B'; const i = Math.floor(Math.log(bytes) / Math.log(1024));
                    return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
                }
                const formatDate = (isoString) => {
                    if (!isoString) return ''; const d = new Date(isoString);
                    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                }

                return { 
                    login, password, isAuthenticated, authError, authenticate, logout, currentTab, switchTab,
                    isResetMode, resetForm, showAdminAlertModal, adminUsers, adminRequests, fetchAdminUsers, forceReset,
                    files, trashFiles, selectedFile, selectedCity, uploading, uploadError, importLogs, uploadProgress,
                    searchQuery, filterCity, sortBy, filteredAndSortedFiles, storageStats, monitoringData, isImage, isVideo,
                    analyticsData, profileForm, updatePassword, requestReset, handleFileSelect, uploadFile, deleteFile, restoreFile, emptyTrash, 
                    schedules, showAddModal, newSchedule, availableScreens, onCityChange, selectAllScreens, 
                    addSchedule, deleteSchedule, formatSize, formatDate, fetchData, fetchTrash, fetchMonitoring
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
