<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage CMS - Secure Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
</head>
<body class="bg-white text-emerald-950 min-h-screen flex flex-col">
    <div id="app" class="flex h-screen overflow-hidden relative">
        
        <div class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none">
            <transition-group 
                enter-active-class="transition duration-300 ease-out transform" enter-from-class="opacity-0 translate-x-8" enter-to-class="opacity-100 translate-x-0"
                leave-active-class="transition duration-200 ease-in transform" leave-from-class="opacity-100 translate-x-0" leave-to-class="opacity-0 translate-x-8">
                <div v-for="toast in toasts" :key="toast.id" 
                     class="px-4 py-3 rounded-lg shadow-xl border flex items-center gap-3 w-80 pointer-events-auto backdrop-blur-sm"
                     :class="{
                        'bg-emerald-50/90 text-emerald-900 border-emerald-200': toast.type === 'success',
                        'bg-red-50/90 text-red-900 border-red-200': toast.type === 'error',
                        'bg-amber-50/90 text-amber-900 border-amber-200': toast.type === 'warning' || toast.type === 'info'
                     }">
                    <span v-if="toast.type === 'success'" class="text-emerald-500 text-lg shrink-0">✅</span>
                    <span v-if="toast.type === 'error'" class="text-red-500 text-lg shrink-0">❌</span>
                    <span v-if="toast.type === 'warning' || toast.type === 'info'" class="text-amber-500 text-lg shrink-0">⚠️</span>
                    <p class="text-sm font-medium leading-tight">{{ toast.message }}</p>
                </div>
            </transition-group>
        </div>

        <div v-if="!isAuthenticated" class="w-full max-w-md mx-auto mt-16 bg-emerald-50 p-8 rounded-xl border border-emerald-200 shadow-xl self-start">
            <h2 class="text-2xl font-bold mb-6 text-emerald-800 text-center">Вход в систему</h2>
            <div v-if="!isResetMode">
                <input v-model="login" type="text" placeholder="Логин (например, user_msk)" class="w-full mb-4 px-4 py-2 bg-white border border-emerald-300 rounded text-emerald-950 focus:outline-none focus:border-emerald-600 text-sm">
                <input v-model="password" type="password" @keyup.enter="authenticate" placeholder="Пароль" class="w-full mb-4 px-4 py-2 bg-white border border-emerald-300 rounded text-emerald-950 focus:outline-none focus:border-emerald-600 text-sm">
                <button @click="authenticate" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition text-sm mb-3">Войти</button>
                <div class="text-center">
                    <button @click="isResetMode = true; resetForm.success = ''" class="text-xs text-emerald-700 hover:underline">Забыли пароль?</button>
                </div>
            </div>
            <div v-else class="space-y-3">
                <p class="text-xs text-emerald-800">Введите ваш логин для отправки запроса администратору:</p>
                <input v-model="resetForm.username" type="text" placeholder="Ваш логин" class="w-full px-4 py-2 bg-white border border-emerald-300 rounded text-sm focus:outline-none focus:border-emerald-600">
                <button @click="requestReset" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm font-medium">Отправить запрос</button>
                <button @click="isResetMode = false" class="w-full bg-emerald-200 hover:bg-emerald-300 text-emerald-900 py-2 rounded text-sm">Назад ко входу</button>
                <p v-if="resetForm.success" class="text-xs text-emerald-700 bg-emerald-100 p-2 rounded mt-2 text-center">{{ resetForm.success }}</p>
            </div>
            <p v-if="authError" class="mt-4 text-red-600 text-xs text-center">{{ authError }}</p>
        </div>

        <template v-else>
            <div v-if="showAdminAlertModal && login === 'admin_main'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <div class="bg-white p-6 rounded-xl max-w-md w-full border border-emerald-200 shadow-2xl text-center">
                    <div class="text-amber-600 text-3xl mb-2">🔔</div>
                    <h3 class="text-lg font-bold text-emerald-900 mb-2">Внимание, запросы сброса!</h3>
                    <p class="text-xs text-emerald-700 mb-4">Есть активные запросы на сброс пароля от региональных пользователей.</p>
                    <div class="bg-amber-50 p-3 rounded mb-6 text-left max-h-32 overflow-y-auto border border-amber-200">
                        <div v-for="req in adminRequests" :key="req.username" class="text-xs text-amber-900 mb-1">
                            • Пользователь: <span class="font-semibold">{{ req.username }}</span> ({{ req.time }})
                        </div>
                    </div>
                    <button @click="showAdminAlertModal = false; switchTab('users')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm font-medium">Перейти к управлению</button>
                </div>
            </div>

            <aside class="w-64 bg-emerald-50 border-r border-emerald-200 flex flex-col hidden md:flex h-full">
                <div class="p-4 border-b border-emerald-200">
                    <h1 class="text-xl font-bold tracking-tight text-emerald-800">DS CMS</h1>
                    <p class="text-emerald-700 text-xs mt-1">Роль: {{ login === 'admin_main' ? 'Администратор' : 'Рег. пользователь' }}</p>
                </div>
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                    <a href="#" @click.prevent="switchTab('media')" :class="currentTab === 'media' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📁 Медиатека</a>
                    <!-- Плейлисты видны ТОЛЬКО администратору -->
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('playlists')" :class="currentTab === 'playlists' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📑 Плейлисты</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('import')" :class="currentTab === 'import' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📥 Импорт файлов</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('trash')" :class="currentTab === 'trash' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">🗑️ Корзина</a>
                    <a href="#" @click.prevent="switchTab('schedule')" :class="currentTab === 'schedule' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📅 Расписания</a>
                    <a href="#" @click.prevent="switchTab('monitoring')" :class="currentTab === 'monitoring' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">🖥️ Мониторинг сети</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('reports')" :class="currentTab === 'reports' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">📊 Отчёты</a>
                    <a href="#" v-if="login === 'admin_main'" @click.prevent="switchTab('users')" :class="currentTab === 'users' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">👥 Пользователи <span v-if="adminRequests.length > 0" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1">{{ adminRequests.length }}</span></a>
                    <a href="#" @click.prevent="switchTab('profile')" :class="currentTab === 'profile' ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'text-emerald-900 hover:bg-emerald-100/60'" class="block px-4 py-2 rounded-lg transition">👤 Профиль</a>
                </nav>
                
                <div class="p-4 border-t border-emerald-200 bg-emerald-100/40">
                    <div class="mb-4">
                        <p class="text-xs text-emerald-800 font-semibold mb-1 flex justify-between"><span>Хранилище</span><span>{{ storageStats.percent }}%</span></p>
                        <div class="w-full bg-emerald-200 rounded-full h-1.5 mb-1">
                            <div :class="storageStats.percent > 90 ? 'bg-red-500' : 'bg-emerald-500'" class="h-1.5 rounded-full" :style="{ width: storageStats.percent + '%' }"></div>
                        </div>
                        <p class="text-[10px] text-emerald-600">{{ formatSize(storageStats.used) }} из 100 ГБ</p>
                    </div>
                    <button @click="requestConfirm($event, 'Вы действительно хотите выйти из системы?', logoutHandler)" class="w-full bg-red-100 hover:bg-red-200 text-red-800 border border-red-300 px-4 py-2 rounded-lg text-sm transition font-medium">Выйти</button>
                </div>
            </aside>

            <main class="flex-1 p-8 overflow-y-auto bg-white h-full">
                
                <div v-if="currentTab === 'users' && login === 'admin_main'" class="space-y-6">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-emerald-900">Управление учетными записями</h2>
                            <div class="flex gap-2">
                                <button @click="showAddUserModal = true" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md font-medium shadow-sm">+ Новый пользователь</button>
                                <button @click="fetchAdminUsers" class="text-xs bg-emerald-200 hover:bg-emerald-300 text-emerald-900 px-3 py-1.5 rounded-md font-medium">Обновить</button>
                            </div>
                        </div>

                        <div v-if="showAddUserModal" class="bg-emerald-100/50 border border-emerald-200 rounded-xl p-6 shadow-md mb-6">
                            <h3 class="text-lg font-medium mb-4 text-emerald-800">Создание нового пользователя</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Логин (Username)</label>
                                    <input v-model="newUserForm.username" type="text" placeholder="Например: user_kazan" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Первичный пароль</label>
                                    <input v-model="newUserForm.password" type="text" placeholder="Пароль для входа" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Роль</label>
                                    <select v-model="newUserForm.role" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                                        <option value="regional">Региональный (Филиал)</option>
                                        <option value="admin">Администратор (Полный доступ)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-emerald-700 mb-1 font-medium">Филиал (Город)</label>
                                    <select v-model="newUserForm.city_id" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                                        <option value="global">Глобальная сеть (Все города)</option>
                                        <option value="moscow">Москва</option>
                                        <option value="spb">Санкт-Петербург</option>
                                        <option value="novocheboksarsk">Новочебоксарск</option>
                                        <option value="yartsevo">Ярцево</option>
                                        <option value="azov">Азов</option>
                                        <option value="orenburg">Оренбург</option>
                                        <option value="chernyakhovsk">Черняховск</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button @click="showAddUserModal = false" class="bg-emerald-200 text-emerald-900 px-4 py-2 rounded text-sm">Отмена</button>
                                <button @click="createUser" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm">Создать пользователя</button>
                            </div>
                        </div>

                        <div v-if="adminRequests.length > 0" class="mb-8 bg-amber-50 border border-amber-300 rounded-lg p-4">
                            <h3 class="text-sm font-bold text-amber-900 mb-3">🔔 Запросы на сброс пароля от пользователей:</h3>
                            <div class="space-y-2">
                                <div v-for="req in adminRequests" :key="req.username" class="bg-white border border-amber-200 p-3 rounded flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-semibold text-emerald-900">Пользователь: <span class="text-emerald-700 font-bold">{{ req.username }}</span></p>
                                        <p class="text-slate-500 text-[10px]">Время запроса: {{ req.time }}</p>
                                    </div>
                                    <button @click="requestConfirm($event, `Сбросить пароль для ${req.username}?`, () => forceReset(req.username))" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded transition font-medium">Выдать новый пароль</button>
                                </div>
                            </div>
                        </div>
                        <h3 class="text-sm font-semibold text-emerald-900 mb-3">Все пользователи системы</h3>
                        <div class="bg-white border border-emerald-200 rounded-lg overflow-hidden">
                            <table class="w-full text-sm text-left text-emerald-900">
                                <thead class="text-xs text-emerald-800 uppercase bg-emerald-100/70 border-b border-emerald-200">
                                    <tr>
                                        <th class="px-6 py-3">Логин</th>
                                        <th class="px-6 py-3">Роль</th>
                                        <th class="px-6 py-3">Филиал / Город</th>
                                        <th class="px-6 py-3">Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(info, uname) in adminUsers" :key="uname" class="border-b border-emerald-200 hover:bg-emerald-50">
                                        <td class="px-6 py-4 font-medium">{{ uname }}</td>
                                        <td class="px-6 py-4">{{ info.role === 'admin' ? 'Администратор' : 'Региональный' }}</td>
                                        <td class="px-6 py-4">{{ info.city_id }}</td>
                                        <td class="px-6 py-4 flex gap-2">
                                            <button @click="requestConfirm($event, `Сбросить пароль для ${uname}?`, () => forceReset(uname))" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition">Сбросить пароль</button>
                                            <button v-if="uname !== login" @click="requestConfirm($event, `Точно удалить пользователя ${uname}? Это действие необратимо!`, () => deleteUser(uname))" class="bg-red-50 hover:bg-red-100 text-red-700 text-xs px-3 py-1.5 rounded border border-red-200 transition">Удалить</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'profile'">
                    <section class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm max-w-xl mx-auto">
                        <h2 class="text-xl font-semibold text-emerald-900 mb-6">Настройки профиля</h2>
                        <div class="mb-8 p-4 bg-white rounded-lg border border-emerald-200">
                            <p class="text-sm text-emerald-600 mb-2">Текущий пользователь:</p>
                            <p class="font-semibold text-emerald-900 text-lg">{{ login }}</p>
                            <p class="text-sm text-emerald-700 mt-1">Роль: {{ login === 'admin_main' ? 'Администратор' : 'Региональный менеджер' }}</p>
                        </div>
                        <div class="p-5 bg-white rounded-lg border border-emerald-200">
                            <h3 class="font-medium text-emerald-900 mb-4">Смена пароля</h3>
                            <input v-model="profileForm.oldPassword" type="password" placeholder="Текущий пароль" class="w-full mb-3 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            <input v-model="profileForm.newPassword" type="password" placeholder="Новый пароль" class="w-full mb-3 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            <input v-model="profileForm.confirmPassword" type="password" placeholder="Повторите новый пароль" class="w-full mb-4 px-4 py-2 border border-emerald-300 rounded focus:outline-none focus:border-emerald-600 text-sm">
                            <button @click="updatePassword" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-sm transition font-medium">Сохранить новый пароль</button>
                            <p v-if="profileForm.error" class="mt-3 text-red-600 text-sm">{{ profileForm.error }}</p>
                            <p v-if="profileForm.success" class="mt-3 text-emerald-600 text-sm font-medium">{{ profileForm.success }}</p>
                        </div>
                    </section>
                </div>

                <div v-if="currentTab === 'media'">
                    <section class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-semibold text-emerald-900">Интерфейс управления контентом</h2>
                            <button @click="fetchFiles(); fetchStats()" class="text-xs bg-emerald-200 hover:bg-emerald-300 text-emerald-900 px-3 py-1.5 rounded-md font-medium">Обновить</button>
                        </div>
                        <div class="flex flex-col md:flex-row gap-3 mb-6 bg-white p-4 rounded-lg border border-emerald-200 shadow-sm">
                            <input v-model="searchQuery" type="text" placeholder="Поиск по имени файла..." class="flex-1 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                            <select v-if="login === 'admin_main'" v-model="filterCity" class="w-full md:w-48 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                                <option value="all">Все папки офисов</option>
                                <option value="global">Глобальная (global)</option>
                                <option value="moscow">Москва</option>
                                <option value="spb">Санкт-Петербург</option>
                                <option value="novocheboksarsk">Новочебоксарск</option>
                                <option value="yartsevo">Ярцево</option>
                                <option value="azov">Азов</option>
                                <option value="orenburg">Оренбург</option>
                                <option value="chernyakhovsk">Черняховск</option>
                            </select>
                            <select v-model="sortBy" class="w-full md:w-56 bg-white border border-emerald-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-600">
                                <option value="date_desc">Сначала новые</option>
                                <option value="date_asc">Сначала старые</option>
                                <option value="name_asc">По имени (А - Я)</option>
                                <option value="name_desc">По имени (Я - А)</option>
                                <option value="size_desc">Размер (большие сверху)</option>
                                <option value="size_asc">Размер (маленькие сверху)</option>
                            </select>
                        </div>
                        <div v-if="filteredAndSortedFiles.length === 0" class="text-center py-8 text-emerald-700 bg-white rounded-lg border border-dashed border-emerald-200">Контент не найден.</div>
                        <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div v-for="file in filteredAndSortedFiles" :key="file.name" class="bg-white border border-emerald-200 p-4 rounded-lg flex flex-col gap-3 shadow-sm hover:shadow-md transition">
                                <div class="flex items-center gap-3">
                                    <div class="shrink-0 w-16 h-16 bg-slate-100 border border-emerald-100 rounded flex items-center justify-center overflow-hidden">
                                        <img v-if="isImage(file.name)" :src="file.url" class="object-cover w-full h-full">
                                        <video v-else-if="isVideo(file.name)" :src="file.url" class="object-cover w-full h-full" muted></video>
                                        <span v-else class="text-xs font-bold text-emerald-400">ФАЙЛ</span>
                                    </div>
                                    <div class="overflow-hidden">
                                        <p class="font-medium text-sm text-emerald-900 truncate" :title="file.name">{{ file.name }}</p>
                                        <p class="text-[11px] text-emerald-600 mt-0.5">Размер: {{ formatSize(file.size) }}</p>
                                        <p class="text-[11px] text-emerald-600">{{ formatDate(file.last_modified) }}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2 mt-auto">
                                    <a :href="file.url" target="_blank" class="flex-1 text-center bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs px-3 py-1.5 rounded transition font-medium">Смотреть</a>
                                    <button v-if="login === 'admin_main'" @click="requestConfirm($event, 'Переместить файл в корзину?', () => deleteFile(file.name))" class="flex-1 bg-red-50 hover:bg-red-100 text-red-700 text-xs px-3 py-1.5 rounded border border-red-200 transition">В корзину</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Вкладка Плейлисты (доступна только админу) -->
                <div v-if="currentTab === 'playlists' && login === 'admin_main'" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-emerald-900">Управление плейлистами (Фото/Видео ряды)</h2>
                        <button v-if="login === 'admin_main'" @click="showPlaylistModal = true" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm shadow-sm">+ Создать плейлист</button>
                    </div>

                    <div v-if="showPlaylistModal" class="bg-emerald-50 border border-emerald-200 rounded-xl p-6 shadow-md">
                        <h3 class="text-lg font-medium mb-4 text-emerald-800">Конструктор плейлиста</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs text-emerald-700 mb-1 font-medium">Название плейлиста</label>
                                <input v-model="newPlaylist.name" type="text" placeholder="Например: Утренний показ" class="w-full bg-white border border-emerald-300 rounded p-2 text-sm">
                            </div>
                            <div>

        <div v-if="confirmDialog.show" class="fixed inset-0 z-[100]" @click="confirmDialog.show = false"></div>
        <transition 
            enter-active-class="transition duration-200 ease-out origin-bottom" enter-from-class="opacity-0 scale-90" enter-to-class="opacity-100 scale-100"
            leave-active-class="transition duration-150 ease-in origin-bottom" leave-from-class="opacity-100 scale-100" leave-to-class="opacity-0 scale-90">
            <div v-if="confirmDialog.show" :style="{ top: confirmDialog.y + 'px', left: confirmDialog.x + 'px' }" class="fixed z-[101] transform -translate-x-1/2" :class="confirmDialog.isBelow ? 'mt-[10px]' : '-translate-y-full mt-[-10px]'">
                <div class="bg-white border border-emerald-300 shadow-2xl rounded-xl p-4 w-64 relative">
                    <div class="absolute left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-emerald-300 rotate-45" :class="confirmDialog.isBelow ? '-top-2 border-t border-l' : '-bottom-2 border-b border-r'"></div>

                        <button @click.stop="confirmDialog.show = false" class="bg-red-50 hover:bg-red-100 text-red-700 text-xs px-5 py-2 rounded-md font-medium border border-red-200 transition">Нет</button>

    <!-- СКРИПТ ЛОГИКИ VUE -->
    <script>
        const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

        function useHelpers() {
            const isImage = (name) => /\.(jpeg|jpg|png|webp|gif|svg|heic)$/i.test(name);
            const isVideo = (name) => /\.(mp4|mov|mkv|webm|avi)$/i.test(name);
            const formatSize = (bytes) => {
                if (bytes === 0) return '0 B'; 
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            };
            const formatDate = (isoString, withSeconds = false) => {
                if (!isoString) return ''; 
                const d = new Date(isoString);
                const options = { hour: '2-digit', minute:'2-digit', hour12: false };
                if (withSeconds) options.second = '2-digit';
                return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', options);
            };
            const getRemainingDays = (deletedAt) => {
                if (!deletedAt) return 'Срок неизвестен';
                const expiryDate = new Date(new Date(deletedAt).getTime() + 30 * 24 * 60 * 60 * 1000);
                const diffDays = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));
                return diffDays <= 0 ? 'Истекает сегодня' : `Осталось хранения: ${diffDays} дн.`;
            };
            return { isImage, isVideo, formatSize, formatDate, getRemainingDays };
        }

        function useToasts() {
            const toasts = ref([]); let toastIdCounter = 0;
            const showToast = (message, type = 'info') => {
                const id = toastIdCounter++;
                toasts.value.push({ id, message, type });
                setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 4500);
            };
            
            const safeJson = async (res) => {
                try { return await res.json(); } 
                catch (e) { return { detail: "Ошибка сервера или неверный формат ответа" }; }
            };
            
            return { toasts, showToast, safeJson };
        }

        function useConfirm() {
            const confirmDialog = ref({ show: false, x: 0, y: 0, text: '', onConfirm: null, isBelow: false });
            const requestConfirm = (e, text, callback) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const posX = rect.left + rect.width / 2;
                const isNearTop = rect.top < 120;
                const posY = isNearTop ? rect.bottom : rect.top;
                confirmDialog.value = { show: true, x: posX, y: posY, text: text, onConfirm: callback, isBelow: isNearTop };
            };
            return { confirmDialog, requestConfirm };
        }

        function useAuth(API_BASE, showToast, safeJson) {
            const savedHeader = sessionStorage.getItem('ds_auth_header');
            const savedLogin = sessionStorage.getItem('ds_login');

            const login = ref(savedLogin || ''); 
            const password = ref(''); 
            const isAuthenticated = ref(!!savedHeader);
            const authError = ref(''); 
            const authHeader = ref(savedHeader || '');
            const isResetMode = ref(false); 
            const resetForm = ref({ username: '', success: '' });
            const profileForm = ref({ oldPassword: '', newPassword: '', confirmPassword: '', error: '', success: '' });
            const showAdminAlertModal = ref(false);

            const doLogin = async () => {
                const header = 'Basic ' + btoa(login.value + ':' + password.value);
                try {
                    const res = await fetch(`${API_BASE}/files/`, { headers: { 'Authorization': header } });
                    if (res.ok) { 
                        isAuthenticated.value = true;
                        authHeader.value = header;
                        sessionStorage.setItem('ds_auth_header', header);
                        sessionStorage.setItem('ds_login', login.value);
                        return true; 
                    } else { 
                        authError.value = 'Неверный логин/пароль'; 
                        return false; 
                    }
                } catch (e) { authError.value = 'Сервер недоступен'; return false; }
            };

            const requestReset = async () => {
                if (!resetForm.value.username) return;
                try {
                    const res = await fetch(`${API_BASE}/request-reset/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: resetForm.value.username }) });
                    const data = await safeJson(res);
                    resetForm.value.success = res.ok ? 'Запрос успешно отправлен!' : data.detail;
                } catch (e) { resetForm.value.success = 'Ошибка сети'; }
            };

            const updatePassword = async (onSuccessCallback) => {
                profileForm.value.error = ''; profileForm.value.success = '';
                if (!profileForm.value.oldPassword || !profileForm.value.newPassword) return profileForm.value.error = 'Заполните все поля';
                if (profileForm.value.newPassword !== profileForm.value.confirmPassword) return profileForm.value.error = 'Новые пароли не совпадают';
                try {
                    const res = await fetch(`${API_BASE}/change-password/`, { method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, body: JSON.stringify({ old_password: profileForm.value.oldPassword, new_password: profileForm.value.newPassword }) });
                    const data = await safeJson(res);
                    if (res.ok) {
                        profileForm.value.success = 'Пароль изменен! Войдите с новым паролем.';
                        profileForm.value.oldPassword = ''; profileForm.value.newPassword = ''; profileForm.value.confirmPassword = '';
                        setTimeout(onSuccessCallback, 2000);
                    } else { profileForm.value.error = data.detail || 'Ошибка смены пароля'; }
                } catch (e) { profileForm.value.error = 'Ошибка сети'; }
            };

            const doLogout = () => { 
                isAuthenticated.value = false; login.value = ''; password.value = ''; authHeader.value = '';
                sessionStorage.removeItem('ds_auth_header'); sessionStorage.removeItem('ds_login');
            };

            return { login, password, isAuthenticated, authError, authHeader, isResetMode, resetForm, profileForm, showAdminAlertModal, doLogin, requestReset, updatePassword, doLogout };
        }

        function useUsers(API_BASE, authHeader, showToast, safeJson) {
            const adminUsers = ref({}); const adminRequests = ref([]);
            const showAddUserModal = ref(false);
            const newUserForm = ref({ username: '', password: '', role: 'regional', city_id: 'moscow' });

            const fetchAdminUsers = async () => {
                try {
                    const res = await fetch(`${API_BASE}/admin/users/`, { headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { const data = await safeJson(res); adminUsers.value = data.users || {}; adminRequests.value = data.requests || []; }
                } catch (e) {}
            };

            const createUser = async () => {
                if (!newUserForm.value.username || !newUserForm.value.password) return showToast('Заполните логин и пароль', 'warning');
                try {
                    const res = await fetch(`${API_BASE}/admin/users/`, { method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, body: JSON.stringify(newUserForm.value) });
                    if (res.ok) {
                        showAddUserModal.value = false; newUserForm.value = { username: '', password: '', role: 'regional', city_id: 'moscow' };
                        fetchAdminUsers(); showToast('Пользователь успешно создан', 'success');
                    } else { const data = await safeJson(res); showToast(data.detail || 'Ошибка создания', 'error'); }
                } catch (e) { showToast('Ошибка сети', 'error'); }
            };

            const deleteUser = async (uname) => {
                try {
                    const res = await fetch(`${API_BASE}/admin/users/${uname}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { fetchAdminUsers(); showToast('Пользователь удален', 'success'); } 
                    else { const data = await safeJson(res); showToast(data.detail || 'Ошибка удаления', 'error'); }
                } catch (e) { showToast('Ошибка сети', 'error'); }
            };

            const forceReset = async (uname) => {
                try {
                    const res = await fetch(`${API_BASE}/admin/reset-password/`, { method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, body: JSON.stringify({ username: uname }) });
                    const data = await safeJson(res);
                    if (res.ok) { 
                        fetchAdminUsers(); 
                        alert(`🛑 ВАЖНО: ПАРОЛЬ СБРОШЕН!\n\nПользователь: ${uname}\nВременный пароль: ${data.temp_password}\n\nОбязательно передайте этот пароль сотруднику!`);
                    } else { showToast(data.detail || 'Ошибка сброса', 'error'); }
                } catch (e) { showToast('Ошибка сети', 'error'); }
            };

            return { adminUsers, adminRequests, showAddUserModal, newUserForm, fetchAdminUsers, createUser, deleteUser, forceReset };
        }

        function useMedia(API_BASE, authHeader, showToast, login, safeJson) {
            const files = ref([]); const trashFiles = ref([]);
            const searchQuery = ref(''); const filterCity = ref('all'); const sortBy = ref('date_desc');
            const selectedFile = ref(null); const selectedCity = ref('global');
            const uploading = ref(false); const uploadError = ref(''); const uploadProgress = ref(0);
            const importLogs = ref([]); const storageStats = ref({used: 0, max: 0, percent: 0});

            const fetchFiles = async () => {
                try {
                    const res = await fetch(`${API_BASE}/files/`, { headers: { 'Authorization': authHeader.value } });
                    const data = await safeJson(res); files.value = data.files || [];
                } catch (e) {}
            };

            const fetchTrash = async () => {
                try {
                    const res = await fetch(`${API_BASE}/trash/`, { headers: { 'Authorization': authHeader.value } });
                    const data = await safeJson(res); trashFiles.value = data.trash || [];
                } catch (e) {}
            };

            const fetchStats = async () => {
                try {
                    const res = await fetch(`${API_BASE}/storage-stats/`, { headers: { 'Authorization': authHeader.value } });
                    storageStats.value = await safeJson(res);
                } catch (e) {}
            };

            const handleFileSelect = (e) => selectedFile.value = e.target.files[0];

            const uploadFile = () => {
                if (!selectedFile.value) return showToast('Файл не выбран', 'warning');
                uploading.value = true; uploadError.value = ''; uploadProgress.value = 0;
                const formData = new FormData(); formData.append('file', selectedFile.value); formData.append('target_city', selectedCity.value);
                const xhr = new XMLHttpRequest(); xhr.open('POST', `${API_BASE}/upload/`, true); xhr.setRequestHeader('Authorization', authHeader.value);
                xhr.upload.onprogress = (event) => { if (event.lengthComputable) uploadProgress.value = Math.round((event.loaded / event.total) * 100); };
                xhr.onload = () => {
                    uploading.value = false;
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (xhr.status === 200) {
                            importLogs.value.unshift({ filename: selectedFile.value.name, success: true, text: data.message });
                            selectedFile.value = null; fetchFiles(); fetchStats(); showToast('Файл успешно загружен', 'success');
                        } else {
                            uploadError.value = data.detail || 'Ошибка импорта';
                            importLogs.value.unshift({ filename: selectedFile.value.name, success: false, text: data.detail });
                            showToast(data.detail, 'error');
                        }
                    } catch (e) { uploadError.value = 'Ошибка сервера'; showToast('Ошибка сервера', 'error'); }
                };
                xhr.onerror = () => { uploading.value = false; uploadError.value = 'Сервер недоступен'; showToast('Сервер недоступен', 'error'); };
                xhr.send(formData);
            };

            const deleteFile = async (fileName) => {
                await fetch(`${API_BASE}/files/${encodeURIComponent(fileName)}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                fetchFiles(); fetchTrash(); fetchStats(); showToast('Перемещено в корзину', 'success');
            };

            const restoreFile = async (fileName) => {
                await fetch(`${API_BASE}/trash/restore/${encodeURIComponent(fileName)}`, { method: 'POST', headers: { 'Authorization': authHeader.value } });
                fetchFiles(); fetchTrash(); fetchStats(); showToast('Файл восстановлен', 'success');
            };

            const emptyTrash = async () => {
                await fetch(`${API_BASE}/trash/empty/`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                fetchTrash(); fetchStats(); showToast('Корзина полностью очищена', 'success');
            };

            const filteredAndSortedFiles = computed(() => {
                let result = files.value;
                if (searchQuery.value) result = result.filter(f => f.name.toLowerCase().includes(searchQuery.value.toLowerCase()));
                if (login.value === 'admin_main' && filterCity.value !== 'all') { result = result.filter(f => f.name.startsWith(filterCity.value + '/')); }
                result = result.slice().sort((a, b) => {
                    if (sortBy.value === 'name_asc') return a.name.localeCompare(b.name);
                    if (sortBy.value === 'name_desc') return b.name.localeCompare(a.name);
                    if (sortBy.value === 'size_desc') return b.size - a.size;
                    if (sortBy.value === 'size_asc') return a.size - b.size;
                    const dateA = new Date(a.last_modified).getTime() || 0; const dateB = new Date(b.last_modified).getTime() || 0;
                    if (sortBy.value === 'date_desc') return dateB - dateA;
                    if (sortBy.value === 'date_asc') return dateA - dateB;
                    return 0;
                });
                return result;
            });

            return { files, trashFiles, searchQuery, filterCity, sortBy, selectedFile, selectedCity, uploading, uploadError, uploadProgress, importLogs, storageStats, filteredAndSortedFiles, handleFileSelect, fetchFiles, fetchTrash, fetchStats, uploadFile, deleteFile, restoreFile, emptyTrash };
        }

        function usePlaylists(API_BASE, authHeader, showToast, isImage, isVideo, safeJson) {
            const playlists = ref([]); const showPlaylistModal = ref(false); const selectedFileToAdd = ref('');
            const newPlaylist = ref({ name: '', city: 'global', items: [], interval: 3, repeats: 1 });
            const showPreviewModal = ref(false); const previewPlaylistName = ref(''); const previewItems = ref([]);
            const previewIndex = ref(0); const previewCurrentItem = computed(() => previewItems.value[previewIndex.value] || null);
            let previewTimer = null;
            
            const fetchPlaylists = async () => {
                try {
                    const res = await fetch(`${API_BASE}/playlists/`, { headers: { 'Authorization': authHeader.value } });
                    const data = await safeJson(res); playlists.value = data.playlists || [];
                } catch (e) {}
            };

            const addFileToPlaylist = () => { if (!selectedFileToAdd.value) return; newPlaylist.value.items.push({ file: selectedFileToAdd.value, duration: 10 }); };
            const removePlaylistItem = (index) => { newPlaylist.value.items.splice(index, 1); };
            const movePlaylistItem = (index, direction) => {
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= newPlaylist.value.items.length) return;
                const item = newPlaylist.value.items.splice(index, 1)[0];
                newPlaylist.value.items.splice(newIndex, 0, item);
            };

            const savePlaylist = async () => {
                if (!newPlaylist.value.name.trim() || newPlaylist.value.items.length === 0) return showToast('Укажите название и добавьте файлы!', 'warning');
                try {
                    const res = await fetch(`${API_BASE}/playlists/`, { method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, body: JSON.stringify(newPlaylist.value) });
                    if (res.ok) {
                        newPlaylist.value = { name: '', city: 'global', items: [], interval: 3, repeats: 1 };
                        showPlaylistModal.value = false; fetchPlaylists(); showToast('Плейлист сохранен!', 'success');
                    } else { const err = await safeJson(res); showToast(err.detail || 'Ошибка сохранения', 'error'); }
                } catch (e) { showToast('Ошибка сети', 'error'); }
            };

            const deletePlaylist = async (id) => {
                try {
                    const res = await fetch(`${API_BASE}/playlists/${id}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { fetchPlaylists(); showToast('Плейлист удален', 'success'); }
                } catch (e) { showToast('Ошибка сети', 'error'); }
            };

            const runPreviewStep = () => {
                if (!showPreviewModal.value) return;
                const item = previewItems.value[previewIndex.value];
                if (!item) return;
                let delay = (item.duration || 10) * 1000;
                if (isVideo(item.file)) delay = 5000;
                if (previewTimer) clearTimeout(previewTimer);
                previewTimer = setTimeout(() => { previewIndex.value = (previewIndex.value + 1) % previewItems.value.length; runPreviewStep(); }, delay);
            };

            const startPreview = (pl) => {
                if (!pl.items || pl.items.length === 0) return showToast('Плейлист пуст', 'warning');
                previewPlaylistName.value = pl.name; previewItems.value = pl.items; previewIndex.value = 0;
                showPreviewModal.value = true; runPreviewStep();
            };

            const closePreview = () => { showPreviewModal.value = false; if (previewTimer) clearTimeout(previewTimer); };

            return { playlists, showPlaylistModal, selectedFileToAdd, newPlaylist, showPreviewModal, previewPlaylistName, previewItems, previewIndex, previewCurrentItem, fetchPlaylists, addFileToPlaylist, removePlaylistItem, movePlaylistItem, savePlaylist, deletePlaylist, startPreview, closePreview };
        }

        function useSchedules(API_BASE, authHeader, showToast, requestConfirm, safeJson) {
            const schedules = ref([]); const showAddModal = ref(false); const scheduleType = ref('file');
            const newSchedule = ref({ file: '', playlist_id: null, city: 'global', screens: [], time_start: '', time_end: '' });
            const allScreensMap = ref({}); const availableScreens = ref([]);
            
            const cityTimezones = {
                global: { label: 'МСК', offset: 3 }, moscow: { label: 'МСК', offset: 3 }, spb: { label: 'МСК', offset: 3 }, novocheboksarsk: { label: 'МСК', offset: 3 },
                yartsevo: { label: 'МСК', offset: 3 }, azov: { label: 'МСК', offset: 3 }, orenburg: { label: 'МСК+2', offset: 5 }, chernyakhovsk: { label: 'МСК-1', offset: 2 }
            };
            const localCityTimeDisplay = ref('');
            let clockInterval = null;

            const updateLocalClock = () => {
                const selectedOffset = cityTimezones[newSchedule.value.city]?.offset || 3;
                const nowUtc = new Date().getTime() + (new Date().getTimezoneOffset() * 60000);
                const cityDate = new Date(nowUtc + (3600000 * selectedOffset));
                localCityTimeDisplay.value = cityDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            };

            onMounted(() => { clockInterval = setInterval(updateLocalClock, 1000); });
            onUnmounted(() => { if (clockInterval) clearInterval(clockInterval); });

            const fetchScreens = async () => {
                try {
                    const res = await fetch(`${API_BASE}/screens/`, { headers: { 'Authorization': authHeader.value } });
                    const data = await safeJson(res); allScreensMap.value = data.screens || {};
                } catch (e) {}
            };

            const fetchSchedules = async () => {
                try {
                    const res = await fetch(`${API_BASE}/schedules/`, { headers: { 'Authorization': authHeader.value } });
                    const data = await safeJson(res); schedules.value = data.schedules || [];
                } catch (e) {}
            };

            const onCityChange = () => {
                availableScreens.value = newSchedule.value.city === 'global' ? [] : (allScreensMap.value[newSchedule.value.city] || []);
                newSchedule.value.screens = []; updateLocalClock();
            };

            const selectAllScreens = () => { newSchedule.value.screens = [...availableScreens.value]; };

            const openScheduleModal = () => {
                showAddModal.value = true;
                setTimeout(() => {
                    flatpickr("#time_start_picker", { 
                        enableTime: true, time_24hr: true, 
                        altInput: true, altFormat: "Y-m-d H:i", dateFormat: "Y-m-d\\TH:i:00", 
                        locale: "ru", defaultDate: newSchedule.value.time_start || null, 
                        onChange: (selectedDates, dateStr) => { newSchedule.value.time_start = dateStr; } 
                    });
                    flatpickr("#time_end_picker", { 
                        enableTime: true, time_24hr: true, 
                        altInput: true, altFormat: "Y-m-d H:i", dateFormat: "Y-m-d\\TH:i:00", 
                        locale: "ru", defaultDate: newSchedule.value.time_end || null, 
                        onChange: (selectedDates, dateStr) => { newSchedule.value.time_end = dateStr; } 
                    });
                }, 100);
            };

            const addSchedule = (e) => {
                if (scheduleType.value === 'file' && !newSchedule.value.file) return showToast('Выберите файл', 'warning');
                if (scheduleType.value === 'playlist' && !newSchedule.value.playlist_id) return showToast('Выберите плейлист', 'warning');
                if (!newSchedule.value.time_start || !newSchedule.value.time_end) return showToast('Заполните время', 'warning');

                const st = new Date(newSchedule.value.time_start);
                const en = new Date(newSchedule.value.time_end);
                if (en <= st) return showToast('Время окончания должно быть позже начала', 'error');

                requestConfirm(e, 'Запланировать эту трансляцию?', async () => {
                    const res = await fetch(`${API_BASE}/schedules/`, { method: 'POST', headers: { 'Authorization': authHeader.value, 'Content-Type': 'application/json' }, body: JSON.stringify(newSchedule.value) });
                    if (!res.ok) {
                        const resData = await safeJson(res); showToast(resData.detail, 'error');
                    } else {
                        newSchedule.value = { file: '', playlist_id: null, city: 'global', screens: [], time_start: '', time_end: '' };
                        showAddModal.value = false; fetchSchedules(); showToast('Трансляция запланирована', 'success');
                    }
                });
            };

            const deleteSchedule = async (id) => {
                await fetch(`${API_BASE}/schedules/${id}`, { method: 'DELETE', headers: { 'Authorization': authHeader.value } });
                fetchSchedules(); showToast('Трансляция удалена', 'info');
            };

            return { schedules, showAddModal, scheduleType, newSchedule, allScreensMap, availableScreens, cityTimezones, localCityTimeDisplay, fetchScreens, fetchSchedules, onCityChange, selectAllScreens, openScheduleModal, addSchedule, deleteSchedule };
        }

        function useReports(API_BASE, authHeader, showToast, safeJson) {
            const monitoringData = ref([]); 
            const analyticsData = ref({ total_shows: 0, total_hours: 0, status_counts: {}, city_counts: {} });
            const activityHistory = ref([]); 
            const storageHistory = ref([]); 
            
            const chartStatusRef = ref(null);
            const chartCityRef = ref(null);
            let chartStatusInstance = null; let chartCityInstance = null;

            const fetchMonitoring = async () => {
                try {
                    const res = await fetch(`${API_BASE}/monitoring/`, { headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { const data = await safeJson(res); monitoringData.value = data.monitoring || []; }
                } catch (e) {}
            };

            const fetchHistory = async () => {
                try {
                    const res = await fetch(`${API_BASE}/history/`, { headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { const data = await safeJson(res); activityHistory.value = data.history || []; }
                } catch (e) { showToast('Не удалось загрузить системный журнал', 'error'); }
            };

            const fetchStorageHistory = async () => {
                try {
                    const res = await fetch(`${API_BASE}/storage-history/`, { headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { const data = await safeJson(res); storageHistory.value = data.storage_history || []; }
                } catch (e) { showToast('Не удалось загрузить историю хранилища', 'error'); }
            };

            const fetchAnalytics = async () => {
                try {
                    const res = await fetch(`${API_BASE}/analytics/`, { headers: { 'Authorization': authHeader.value } });
                    if (res.ok) { analyticsData.value = await safeJson(res); }
                    
                    nextTick(() => {
                        if (chartStatusInstance) chartStatusInstance.destroy();
                        if (chartCityInstance) chartCityInstance.destroy();
                        
                        if (chartStatusRef.value) {
                            chartStatusInstance = new Chart(chartStatusRef.value, { type: 'doughnut', data: { labels: Object.keys(analyticsData.value.status_counts), datasets: [{ data: Object.values(analyticsData.value.status_counts), backgroundColor: ['#fbbf24', '#34d399', '#cbd5e1'] }] }, options: { responsive: true, maintainAspectRatio: false } });
                        }
                        if (chartCityRef.value) {
                            chartCityInstance = new Chart(chartCityRef.value, { type: 'bar', data: { labels: Object.keys(analyticsData.value.city_counts), datasets: [{ label: 'Трансляции', data: Object.values(analyticsData.value.city_counts), backgroundColor: '#059669' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } } });
                        }
                    });
                } catch (e) {}
            };

            return { monitoringData, analyticsData, activityHistory, storageHistory, chartStatusRef, chartCityRef, fetchMonitoring, fetchHistory, fetchStorageHistory, fetchAnalytics };
        }

        createApp({
            setup() {
                const origin = window.location.origin;
                const API_BASE = (origin && origin !== 'null' && origin !== 'file://') ? origin : 'http://localhost:8000';
                
                const currentTab = ref('media');
                const helpers = useHelpers();
                const toastStore = useToasts();
                const confirmStore = useConfirm();
                
                const authStore = useAuth(API_BASE, toastStore.showToast, toastStore.safeJson);
                const usersStore = useUsers(API_BASE, authStore.authHeader, toastStore.showToast, toastStore.safeJson);
                const mediaStore = useMedia(API_BASE, authStore.authHeader, toastStore.showToast, authStore.login, toastStore.safeJson);
                const playlistsStore = usePlaylists(API_BASE, authStore.authHeader, toastStore.showToast, helpers.isImage, helpers.isVideo, toastStore.safeJson);
                const schedulesStore = useSchedules(API_BASE, authStore.authHeader, toastStore.showToast, confirmStore.requestConfirm, toastStore.safeJson);
                const reportsStore = useReports(API_BASE, authStore.authHeader, toastStore.showToast, toastStore.safeJson);

                playlistsStore.getFileUrl = (name) => mediaStore.files.value.find(f => f.name === name)?.url || '';
                
                onMounted(async () => {
                    if (authStore.isAuthenticated.value) {
                        if (authStore.login.value === 'admin_main') {
                            await usersStore.fetchAdminUsers();
                            if (usersStore.adminRequests.value.length > 0) authStore.showAdminAlertModal.value = true;
                        }
                        mediaStore.fetchFiles(); mediaStore.fetchStats(); mediaStore.fetchTrash();
                        schedulesStore.fetchScreens(); schedulesStore.fetchSchedules();
                        reportsStore.fetchMonitoring(); 
                        if (authStore.login.value === 'admin_main') playlistsStore.fetchPlaylists();
                    }
                });

                const authenticate = async () => {
                    const success = await authStore.doLogin();
                    if (success) {
                        if (authStore.login.value === 'admin_main') {
                            await usersStore.fetchAdminUsers();
                            if (usersStore.adminRequests.value.length > 0) authStore.showAdminAlertModal.value = true;
                        }
                        mediaStore.fetchFiles(); mediaStore.fetchStats(); mediaStore.fetchTrash();
                        schedulesStore.fetchScreens(); schedulesStore.fetchSchedules();
                        reportsStore.fetchMonitoring(); 
                        if (authStore.login.value === 'admin_main') playlistsStore.fetchPlaylists();
                    }
                };

                const logoutHandler = () => {
                    authStore.doLogout();
                    mediaStore.files.value = []; mediaStore.trashFiles.value = [];
                    schedulesStore.schedules.value = []; playlistsStore.playlists.value = [];
                    currentTab.value = 'media'; authStore.showAdminAlertModal.value = false;
                };

                const switchTab = (tab) => {
                    currentTab.value = tab;
                    if (tab === 'reports') { reportsStore.fetchAnalytics(); reportsStore.fetchHistory(); reportsStore.fetchStorageHistory(); }
                    if (tab === 'users') usersStore.fetchAdminUsers();
                    if (tab === 'playlists' && authStore.login.value === 'admin_main') playlistsStore.fetchPlaylists();
                    if (tab === 'schedule') {
                        if (authStore.login.value === 'admin_main') playlistsStore.fetchPlaylists();
                    }
                };

                const updatePassword = () => authStore.updatePassword(logoutHandler);
                const getPlaylistName = (id) => playlistsStore.playlists.value.find(p => p.id === id)?.name || 'Неизвестный';

                return {
                    API_BASE, currentTab, switchTab, authenticate, logoutHandler, updatePassword, getPlaylistName,
                    ...helpers, ...toastStore, ...confirmStore, ...authStore,
                    ...usersStore, ...mediaStore, ...playlistsStore, ...schedulesStore, ...reportsStore
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
