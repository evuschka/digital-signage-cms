<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage CMS - Управление контентом</title>
    <!-- Подключаем Tailwind CSS для дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="app" class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Шапка -->
        <header class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-blue-400">Digital Signage CMS</h1>
                <p class="text-slate-400 text-sm mt-1">Панель управления медиафайлами для экранов</p>
            </div>
            <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 text-xs">
                Статус бэкенда: <span class="text-green-400 font-semibold">● Онлайн</span>
            </div>
        </header>

        <!-- Блок загрузки файлов -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-slate-200">Загрузка нового контента</h2>
            <div class="flex flex-col sm:flex-row gap-4 items-center">
                <input 
                    type="file" 
                    @change="handleFileSelect" 
                    class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer"
                >
                <button 
                    @click="uploadFile" 
                    :disabled="!selectedFile || uploading"
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-medium px-6 py-2 rounded-lg transition"
                >
                    {{ uploading ? 'Загрузка...' : 'Загрузить файл' }}
                </button>
            </div>
            <p v-if="uploadMessage" class="mt-3 text-sm" :class="uploadSuccess ? 'text-green-400' : 'text-red-400'">
                {{ uploadMessage }}
            </p>
        </section>

        <!-- Блок списка файлов -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-200">Медиатека хранилища</h2>
                <button @click="fetchFiles" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md transition text-slate-300">
                    Обновить список
                </button>
            </div>

            <div v-if="files.length === 0" class="text-center py-8 text-slate-500">
                В хранилище пока нет загруженных файлов.
            </div>

            <div v-else class="space-y-3">
                <div v-for="file in files" :key="file.name" class="bg-slate-900 border border-slate-700/60 p-4 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                        <p class="font-medium text-blue-300 break-all">{{ file.name }}</p>
                        <p class="text-xs text-slate-500 mt-0.5">Размер: {{ formatSize(file.size) }}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <a 
                            :href="file.url" 
                            target="_blank" 
                            class="bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs font-medium px-3.5 py-2 rounded-md border border-slate-700 transition"
                        >
                            Открыть ↗
                        </a>
                        <button 
                            @click="deleteFile(file.name)" 
                            class="bg-red-900/40 hover:bg-red-900 text-red-300 text-xs font-medium px-3.5 py-2 rounded-md border border-red-700/50 transition"
                        >
                            Удалить
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const files = ref([])
                const selectedFile = ref(null)
                const uploading = ref(false)
                const uploadMessage = ref('')
                const uploadSuccess = ref(false)

                // Получение списка файлов с бэкенда
                const fetchFiles = async () => {
                    try {
                        const response = await fetch('http://localhost:8000/files/')
                        const data = await response.json()
                        files.value = data.files || []
                    } catch (error) {
                        console.error('Ошибка загрузки списка:', error)
                    }
                }

                // Выбор файла пользователем
                const handleFileSelect = (event) => {
                    selectedFile.value = event.target.files[0]
                    uploadMessage.value = ''
                }

                // Отправка файла на бэкенд
                const uploadFile = async () => {
                    if (!selectedFile.value) return

                    uploading.value = true
                    uploadMessage.value = ''

                    const formData = new FormData()
                    formData.append('file', selectedFile.value)

                    try {
                        const response = await fetch('http://localhost:8000/upload/', {
                            method: 'POST',
                            body: formData
                        })

                        if (response.ok) {
                            uploadSuccess.value = true
                            uploadMessage.value = 'Файл успешно загружен в систему!'
                            selectedFile.value = null
                            document.querySelector('input[type="file"]').value = ''
                            fetchFiles()
                        } else {
                            throw new Error('Ошибка сервера при загрузке')
                        }
                    } catch (error) {
                        uploadSuccess.value = false
                        uploadMessage.value = 'Не удалось загрузить файл. Проверьте соединение с сервером.'
                    } finally {
                        uploading.value = false
                    }
                }

                // Удаление файла
                const deleteFile = async (fileName) => {
                    if (!confirm(`Вы действительно хотите удалить файл "${fileName}"?`)) return

                    try {
                        const response = await fetch(`http://localhost:8000/files/${encodeURIComponent(fileName)}`, {
                            method: 'DELETE'
                        })

                        if (response.ok) {
                            fetchFiles()
                        } else {
                            throw new Error('Ошибка при удалении файла')
                        }
                    } catch (error) {
                        console.error('Ошибка:', error)
                        alert('Не удалось удалить файл')
                    }
                }

                // Форматирование размера файла
                const formatSize = (bytes) => {
                    if (bytes === 0) return '0 Bytes'
                    const k = 1024
                    const sizes = ['Bytes', 'KB', 'MB', 'GB']
                    const i = Math.floor(Math.log(bytes) / Math.log(k))
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]
                }

                onMounted(() => {
                    fetchFiles()
                })

                return {
                    files,
                    selectedFile,
                    uploading,
                    uploadMessage,
                    uploadSuccess,
                    handleFileSelect,
                    uploadFile,
                    deleteFile,
                    formatSize,
                    fetchFiles
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
