services:
  minio:
    image: minio/minio
    container_name: cms-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_cms
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    restart: always

  minio-setup:
    image: minio/minio
    container_name: cms-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 admin_cms password123;
      mc mb myminio/digital-signage-media || true;
      mc anonymous set download myminio/digital-signage-media || true;
      exit 0;
      "