services:
  minio:
    image: elestio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_cms
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    restart: unless-stopped

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./main.py:/app/main.py
      - ./requirements.txt:/app/requirements.txt
      - ./index.html:/app/index.html
    ports:
      - "8000:8000"
    environment:
      MINIO_ROOT_USER: admin_cms
      MINIO_ROOT_PASSWORD: password123
      MINIO_ENDPOINT: http://minio:9000
      CMS_SECRET_KEY: change-this-to-a-long-random-secret-before-production
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - minio
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules: